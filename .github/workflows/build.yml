name: Build and Test PCTool

on:
  push:
    branches: [ main, 'buoc-*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Phiên bản tăng dần theo số lần chạy: 0.1.<run_number>. App so phiên bản này để tự cập nhật.
      APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PCTool.sln

      - name: Build
        run: dotnet build PCTool.sln -c Release --no-restore

      - name: Test
        run: dotnet test PCTool.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Kiểm tra định dạng code (chỉ báo, chưa chặn)
        run: dotnet format PCTool.sln --verify-no-changes --no-restore
        continue-on-error: true

      - name: Publish 1 file exe
        run: dotnet publish PCTool.App/PCTool.App.csproj -c Release -p:PublishSingleFile=true "-p:Version=$env:APP_VERSION" -o publish

      - name: Upload kết quả test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: PCTool-win-x64
          path: publish/PCTool.exe
          if-no-files-found: error

      # Chỉ khi push lên main (build và test đã đạt): tạo GitHub Release để app tự cập nhật.
      - name: Tạo Release (cho tự cập nhật)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          $env:COMMIT_MSG | Out-File -FilePath notes.txt -Encoding utf8
          gh release create "v$env:APP_VERSION" publish/PCTool.exe --title "PCTool $env:APP_VERSION" --notes-file notes.txt --target $env:GITHUB_SHA
