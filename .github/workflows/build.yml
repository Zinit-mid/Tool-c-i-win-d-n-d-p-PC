name: Build and Test PCTool

on:
  push:
    branches: [ main, 'buoc-*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PCTool.sln

      - name: Build
        run: dotnet build PCTool.sln -c Release --no-restore

      - name: Test
        run: dotnet test PCTool.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Kiểm tra định dạng code (chỉ báo, chưa chặn)
        run: dotnet format PCTool.sln --verify-no-changes --no-restore
        continue-on-error: true

      - name: Publish 1 file exe
        run: dotnet publish PCTool.App/PCTool.App.csproj -c Release -p:PublishSingleFile=true -o publish

      - name: Upload kết quả test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PCTool-win-x64
          path: publish/PCTool.exe
          if-no-files-found: error
